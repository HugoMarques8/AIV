<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@master/dist/aframe-master.js"></script>
	<script src="https://unpkg.com/aframe-event-set-component/dist/aframe-event-set-component.min.js"></script>
	<script
		src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
	<script src="https://unpkg.com/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
	<!-- Blink locomotion / teleportation component -->
	<script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls/dist/aframe-blink-controls.min.js"></script>
	<script src="js/center-grab.js"></script>
	<script src="js/handedness-setup.js"></script>
	<script src="js/ritual-challenge.js"></script>
	<script src="js/thumbstick-movement.js"></script>
</head>
<body>
	<a-scene>
		<!-- Assets: todos os modelos, imagens e recursos -->
		<a-assets>
			<!-- Modelos 3D -->
			<a-asset-item id="gallery-model" src="models_marriage_room/vr_gallery.glb"></a-asset-item>
			<a-asset-item id="showcase1-model" src="models_marriage_room/museum_showcase_-_die_vitrine.glb"></a-asset-item>
			<a-asset-item id="showcase2-model" src="models_marriage_room/showcases_-_asset_pack.glb"></a-asset-item>
			<a-asset-item id="viking-outfit-model" src="models_marriage_room/viking_outfit_compressed.glb"></a-asset-item>
			<a-asset-item id="viking-man-outfit-model" src="models_marriage_room/viking_man_outfit_compressed.glb"></a-asset-item>
			<a-asset-item id="bathtub-model" src="models_marriage_room/medieval_balia.glb"></a-asset-item>
			<a-asset-item id="chair-model" src="models_marriage_room/furniture/viking_chair.glb"></a-asset-item>
			<a-asset-item id="table" src="models_marriage_room/furniture/viking_table.glb"></a-asset-item>
			<!-- Cutlery -->
			<a-asset-item id="viking-bowl" src="models_marriage_room/cutlery/viking_bowl.glb"></a-asset-item>
			<a-asset-item id="viking-cup" src="models_marriage_room/cutlery/viking_model_asset_-_cup.glb"></a-asset-item>
			<a-asset-item id="viking-mug" src="models_marriage_room/cutlery/viking_mug.glb"></a-asset-item>
			<a-asset-item id="viking-cutlery" src="models_marriage_room/cutlery/viking_tea_party_-_cutlery.glb"></a-asset-item>
			<a-asset-item id="viking-horn" src="models_marriage_room/cutlery/viking_tea_party_-_drinking_horn.glb"></a-asset-item>
			<a-asset-item id="viking-stove" src="models_marriage_room/cutlery/viking_tea_party_-_viking_stove.glb"></a-asset-item>
			<a-asset-item id="pillar-model" src="models_marriage_room/viking_column.glb"></a-asset-item>
			<a-asset-item id="rune_sword" src="models_marriage_room/viking_rune_sword.glb"></a-asset-item>
			<a-asset-item id="key-model" src="models_marriage_room/key_in_bronze_viking_age.glb"></a-asset-item>
			<a-asset-item id="statue_viking_goddess" src="models_marriage_room/viking_goddess.glb"></a-asset-item>
			<a-asset-item id="pillar_showcase" src="models_marriage_room/scandinavian_column.glb"></a-asset-item>
			<a-asset-item id="chest-model" src="models_marriage_room/furniture/viking_chest.glb"></a-asset-item>
			<a-asset-item id="npc-idle" src="models_marriage_room/animations_npc/idle.glb"></a-asset-item>
			<a-asset-item id="stone_hammer" src="models_marriage_room/stone_mjolnir.glb"></a-asset-item>
			<!-- Audio -->
			<audio id="astrid-dialogue" src="audio/npc-marriage-dialogue.mp3" preload="auto"></audio>
			<!-- Imagens -->
			<img id="link-image" src="pngtree-gray-network-placeholder-png-image_3416659.jpg">
			<img id="challenge-preview" src="models_marriage_room/images/preview_challenge.png">
			<img id="audio-icon" src="models_marriage_room/images/audio-icon.png">
		</a-assets>
		
		<!-- camera rig (player) -->
		<a-entity id="player" position="0 0 0" thumbstick-movement="speed: 0.9" vr-hands wasd-controls="acceleration: 20">
			<a-entity id="camera" camera position="0 3 0" look-controls="pointerLockEnabled: false"
				cursor="rayOrigin: mouse; fuse: false"
				raycaster="objects: .clickable, .grabbable">
			</a-entity>
		</a-entity>
		
		<!-- Ambiente 3D: modelo GLB -->
		<a-entity id="vr_gallery" gltf-model="#gallery-model" position="0 0 0" scale="1.5 1.5 1.5"></a-entity>
		
		<!-- Vitrines -->
		<a-entity gltf-model="#showcase1-model" position="-9 0 4" scale="1 1 1" rotation="0 90 0"></a-entity>
		<a-entity gltf-model="#showcase1-model" position="3 0 4" scale="1.5 1.5 1.5" rotation="0 0 0"></a-entity>
		<a-entity gltf-model="#showcase2-model" position="-3 0 -5" scale="1.3 1.3 1.3" rotation="0 90 0"></a-entity>
		<a-entity gltf-model="#showcase2-model" position="3 0 -5" scale="1.3 1.3 1.3" rotation="0 -90 0"></a-entity>

		<!-- Roupas dentro das vitrines -->
		<a-entity gltf-model="#viking-outfit-model" position="-5.4 0.35 -5" scale="1.2 1.2 1.2" rotation="0 0 0"></a-entity>
		<!-- Info: Bride's Outfit -->
		<a-entity position="-5.4 1.5 -4.5" rotation="0 180 0">
			<a-plane width="1.3" height="0.4" color="#1a1a1a" opacity="0.85">
				<a-text value="Bride's Wedding Attire\n10th Century" align="center" width="1.2" color="#FFD700" position="0 0 0.01"></a-text>
			</a-plane>
			<a-circle radius="0.1" position="0.75 0 0.02" 
				class="clickable info-trigger" data-info="bride-outfit" 
				src="#audio-icon"
				material="transparent: true; opacity: 0.9; shader: flat; side: double"
				animation="property: scale; to: 1.2 1.2 1.2; dur: 1000; dir: alternate; loop: true; easing: easeInOutSine">
			</a-circle>
		</a-entity>
		
		<a-entity gltf-model="#viking-man-outfit-model" position="5.4 0.35 -5" scale="1.3 1.3 1.3" rotation="0 0 0"></a-entity>
		<!-- Info: Groom's Outfit -->
		<a-entity position="5.4 1.5 -4.5" rotation="0 180 0">
			<a-plane width="1.3" height="0.4" color="#1a1a1a" opacity="0.85">
				<a-text value="Groom's Wedding Attire\n10th Century" align="center" width="1.2" color="#FFD700" position="0 0 0.01"></a-text>
			</a-plane>
			<a-circle radius="0.1" position="0.75 0 0.02" 
				class="clickable info-trigger" data-info="groom-outfit" 
				src="#audio-icon"
				material="transparent: true; opacity: 0.9; shader: flat; side: double"
				animation="property: scale; to: 1.2 1.2 1.2; dur: 1000; dir: alternate; loop: true; easing: easeInOutSine">
			</a-circle>
		</a-entity>
		<!-- modelo de cadeira no showcase1-->
		<a-entity gltf-model="#chair-model" position="-9 0 4" scale="1.6 1.6 1.6" rotation="0 180 0"></a-entity>
		<!-- modelo de mesa-->
		<a-entity gltf-model="#table" position="-1.4 0 4" scale="0.013 0.013 0.013" rotation="0 0 0"></a-entity>		
		<!-- Cutlery em cima da mesa -->
		<a-entity gltf-model="#viking-bowl" position="-2.8 1.65 4.1" scale="0.2 0.2 0.2" rotation="0 90 0"></a-entity>
		<a-entity gltf-model="#viking-cup" position="-4 1.45 4.6" scale="4 4 4" rotation="0 45 0"></a-entity>
		<a-entity gltf-model="#viking-mug" position="-3.4 1.5 4.6" scale="0.2 0.2 0.2" rotation="0 60 0"></a-entity>
		<a-entity gltf-model="#viking-cutlery" position="-2 1.35 4.1" scale="0.2 0.2 0.2" rotation="0 0 0"></a-entity>
		<a-entity gltf-model="#viking-horn" position="-1.6 1.6 4.6" scale="0.4 0.4 0.4" rotation="0 0 0"></a-entity>
		<!-- Bathtub -->
		<a-entity gltf-model="#bathtub-model" position="3 0.8 4" scale="0.7 0.7 0.7"></a-entity>
		<!-- Info: Ceremonial Bath -->
		<a-entity position="3 1 2.5" rotation="0 180 0">
			<a-plane width="1.4" height="0.4" color="#1a1a1a" opacity="0.85">
				<a-text value="Ceremonial Bath\n for the Purification Ritual" align="center" width="1.3" color="#FFD700" position="0 0 0.01"></a-text>
			</a-plane>
			<a-circle radius="0.1" position="0.7 0 0.02" 
				class="clickable info-trigger" data-info="sword" 
				src="#audio-icon"
				material="transparent: true; opacity: 0.9; shader: flat; side: double"
				animation="property: scale; to: 1.2 1.2 1.2; dur: 1000; dir: alternate; loop: true; easing: easeInOutSine">
			</a-circle>
		</a-entity>
		
		<!-- NPC idle ao lado da bathtub -->
		<a-entity id="npc-astrid" gltf-model="#npc-idle" position="8.5 0 4" rotation="0 180 0" scale="0.015 0.015 0.015" animation-mixer class="clickable"></a-entity>
		
		<!-- Painel de subtítulos -->
		<a-entity id="npc-subtitle" position="8.5 3 4" visible="false" rotation="0 180 0">
			<a-plane color="#000000" opacity="0.7" width="6" height="0.5"></a-plane>
			<a-text id="subtitle-text" value="" position="0 0 0.01" 
				align="center" color="#FFFFFF" width="5.5" wrap-count="50">
			</a-text>
		</a-entity>
		
		<!-- Portal (aparece apos falar com a npc) -->
		<a-entity id="challenge-portal" position="10 2 4" visible="false">
			<a-link href="marriageChallenge.html" title="Enter Challenge" image="#challenge-preview" class="clickable" position="0 0 0"></a-link>
		</a-entity>

		<!-- Stove -->
		<a-entity gltf-model="#viking-stove" position="-6 0.6 4" scale="1 1 1" rotation="0 90 0"></a-entity>
		<!-- Viking pillar -->
		<a-entity gltf-model="#pillar-model" position="-1.3 1.6 -5" rotation="0 0 0"></a-entity>
		<!-- Sword on the expositor -->
		<a-entity gltf-model="#rune_sword" position="3 1.2 -5" rotation="0 90 90" scale="1 1 1"></a-entity>
		<!-- Info: Viking Rune Sword -->
		<a-entity position="3 2 -4.7" rotation="0 0 0">
			<a-plane width="0.8" height="0.4" color="#1a1a1a" opacity="0.85">
				<a-text value="Viking Rune Sword\n9th Century" align="center" width="1.1" color="#FFD700" position="0 0 0.01"></a-text>
			</a-plane>
			<a-circle radius="0.1" position="0.7 0 0.02" 
				class="clickable info-trigger" data-info="sword" 
				src="#audio-icon"
				material="transparent: true; opacity: 0.9; shader: flat; side: double"
				animation="property: scale; to: 1.2 1.2 1.2; dur: 1000; dir: alternate; loop: true; easing: easeInOutSine">
			</a-circle>
		</a-entity>
		
		<!-- Statue of Viking goddess -->
		<a-entity gltf-model="#statue_viking_goddess" position="-3 1.6 -5" rotation="0 180 0" scale="1 1 1"></a-entity>
		<a-entity gltf-model="#pillar_showcase" position="-3 0.3 -5" rotation="0 -90 0" scale="0.1 0.05 0.1"></a-entity>
		<!-- Info: Viking Goddess Statue -->
		<a-entity position="-3 0.8 -4.5" rotation="0 180 0">
			<a-plane width="1.4" height="0.4" color="#1a1a1a" opacity="0.85">
				<a-text value="Goddess Freyja Statue\nProtector of Love" align="center" width="1.3" color="#FFD700" position="0 0 0.01"></a-text>
			</a-plane>
			<a-circle radius="0.1" position="0.8 0 0.02" 
				class="clickable info-trigger" data-info="goddess" 
				src="#audio-icon"
				material="transparent: true; opacity: 0.9; shader: flat; side: double"
				animation="property: scale; to: 1.2 1.2 1.2; dur: 1000; dir: alternate; loop: true; easing: easeInOutSine">
			</a-circle>
		</a-entity>
		
		<!-- Mjolnir -->
		<a-entity gltf-model="#stone_hammer" position="1.3 0.55 -5" rotation="0 0 0" scale="0.01 0.01 0.01"></a-entity>
		<!-- Info: Mjolnir -->
		<a-entity position="1.3 0.3 -4.5" rotation="0 180 0">
			<a-plane width="1" height="0.4" color="#1a1a1a" opacity="0.85">
				<a-text value="Mjölnir\nThor's Hammer" align="center" width="0.9" color="#FFD700" position="0 0 0.01"></a-text>
			</a-plane>
			<a-circle radius="0.1" position="0.6 0 0.02" 
				class="clickable info-trigger" data-info="hammer" 
				src="#audio-icon"
				material="transparent: true; opacity: 0.9; shader: flat; side: double"
				animation="property: scale; to: 1.2 1.2 1.2; dur: 1000; dir: alternate; loop: true; easing: easeInOutSine">
			</a-circle>
		</a-entity>
		<!-- Bau -->
		<a-entity gltf-model="#chest-model" position="-9 0 -5" rotation="0 90 0" scale="1 1 1"></a-entity>
		
		<!-- Viking Key Display -->
		<a-entity gltf-model="#pillar_showcase" position="-11 0 -1" rotation="0 0 0" scale="0.1 0.05 0.1"></a-entity>
		<a-entity gltf-model="#key-model" position="-11 1.35 -1" rotation="90 90 0" scale="0.2 0.2 0.2" 
			class="grabbable clickable" grabbable hover center-grab></a-entity>
		
		<!-- Link para voltar ao index.html -->
		<a-entity position="10 1.6 -3" rotation="0 -90 0">
			<a-link href="index.html" title="Voltar ao Início" image="#link-image" class="clickable"></a-link>
		</a-entity>
		
		<script>
			document.addEventListener('DOMContentLoaded', function() {
				const npc = document.querySelector('#npc-astrid');
				const audio = document.querySelector('#astrid-dialogue');
				const subtitlePanel = document.querySelector('#npc-subtitle');
				const subtitleText = document.querySelector('#subtitle-text');
				const portal = document.querySelector('#challenge-portal');
				
				// Legendas sincronizadas com o áudio
				const subtitles = [
					{ time: 0, text: "Welcome, brave one. I am Astrid, keeper of the marriage rituals." },
					{ time: 5, text: "I have just completed the ceremonial bath, as you did before me." },
					{ time: 9, text: "We wash away our former lives, preparing ourselves for this sacred union as our ancestors did before us." },
					{ time: 16, text: "Are you ready to complete the sacred ceremony with me?" },
					{ time: 20, text: "" } // Clear subtitle
				];
				
				let currentSubtitle = 0;
				let audioPlayed = false;
				
				// Clicar na NPC para iniciar diálogo
				npc.addEventListener('click', function() {
					if (!audioPlayed) {
						audio.currentTime = 0;
						currentSubtitle = 0;
						audio.play();
						audioPlayed = true;
					}
				});
				
				// Mostrar painel quando áudio começa
				audio.addEventListener('play', function() {
					subtitlePanel.setAttribute('visible', 'true');
				});
				
				// Atualizar legendas durante o áudio
				audio.addEventListener('timeupdate', function() {
					const currentTime = audio.currentTime;
					if (currentSubtitle < subtitles.length && currentTime >= subtitles[currentSubtitle].time) {
						subtitleText.setAttribute('value', subtitles[currentSubtitle].text);
						currentSubtitle++;
					}
				});
				
				// Esconder legendas e mostrar portal quando terminar
				audio.addEventListener('ended', function() {
					setTimeout(() => {
						subtitlePanel.setAttribute('visible', 'false');
						portal.setAttribute('visible', 'true');
					}, 2000);
				});
				
				// Sistema de informação de objetos
				const infoAudios = {
					'sword': { text: 'This Viking rune sword was used in marriage ceremonies, passed from father to son as a symbol of ancestral protection.' },
					'goddess': { text: 'Freyja, the goddess of love, fertility, and marriage, was invoked to bless Viking unions.' },
					'hammer': { text: 'Mjölnir, Thor\'s hammer, was placed in the bride\'s lap during the ceremony to ensure fertility.' },
					'bride-outfit': { text: 'The bride wore her finest dress, often with intricate embroidery and a bridal crown symbolizing her transition to married life.' },
					'groom-outfit': { text: 'The groom dressed in his best tunic and cloak, wearing symbols of his family\'s status and warrior honor.' },
					'bath': { text: 'Both bride and groom performed a ceremonial bath before the wedding, washing away their former lives as bachelors to begin anew.' }
				};
				
				const infoTriggers = document.querySelectorAll('.info-trigger');
				let currentInfoAudio = null;
				
				infoTriggers.forEach(trigger => {
					trigger.addEventListener('click', function() {
						const infoType = this.getAttribute('data-info');
						const info = infoAudios[infoType];
						
						if (info) {
							// Parar áudio anterior se existir
							if (currentInfoAudio) {
								currentInfoAudio.pause();
							}
							
							// Mostrar texto no painel de subtítulos
							subtitleText.setAttribute('value', info.text);
							subtitlePanel.setAttribute('visible', 'true');
							
							// Esconder após 8 segundos
							setTimeout(() => {
								subtitlePanel.setAttribute('visible', 'false');
							}, 8000);
							
							// Aqui podes adicionar áudio real depois:
							// currentInfoAudio = new Audio('audio/info-' + infoType + '.mp3');
							// currentInfoAudio.play();
						}
					});
				});
			});
		</script>
	</a-scene>
</body>
</html>
