<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@master/dist/aframe-master.js"></script>
	<script src="https://unpkg.com/aframe-event-set-component/dist/aframe-event-set-component.min.js"></script>
	<script
		src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
	<script src="https://unpkg.com/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
	<!-- Blink locomotion / teleportation component -->
	<script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls/dist/aframe-blink-controls.min.js"></script>
	<script src="js/center-grab.js"></script>
	<script src="js/handedness-setup.js"></script>
	<script src="js/ritual-challenge.js"></script>
	<script src="js/thumbstick-movement.js"></script>
	<script src="js/npc-dialogue.js"></script>
</head>
<body>
	<a-scene>
		<!-- Assets: todos os modelos, imagens e recursos -->
		<a-assets>
			<!-- Modelos 3D -->
			<a-asset-item id="gallery-model" src="models_marriage_room/vr_gallery.glb"></a-asset-item>
			<a-asset-item id="showcase1-model" src="models_marriage_room/museum_showcase_-_die_vitrine.glb"></a-asset-item>
			<a-asset-item id="showcase2-model" src="models_marriage_room/showcases_-_asset_pack.glb"></a-asset-item>
			<a-asset-item id="viking-outfit-model" src="models_marriage_room/viking_outfit_compressed.glb"></a-asset-item>
			<a-asset-item id="viking-man-outfit-model" src="models_marriage_room/viking_man_outfit_compressed.glb"></a-asset-item>
			<a-asset-item id="bathtub-model" src="models_marriage_room/medieval_balia.glb"></a-asset-item>
			<a-asset-item id="chair-model" src="models_marriage_room/furniture/viking_chair.glb"></a-asset-item>
			<a-asset-item id="table" src="models_marriage_room/furniture/viking_table.glb"></a-asset-item>
			<!-- Cutlery -->
			<a-asset-item id="viking-bowl" src="models_marriage_room/cutlery/viking_bowl.glb"></a-asset-item>
			<a-asset-item id="viking-cup" src="models_marriage_room/cutlery/viking_model_asset_-_cup.glb"></a-asset-item>
			<a-asset-item id="viking-mug" src="models_marriage_room/cutlery/viking_mug.glb"></a-asset-item>
			<a-asset-item id="viking-cutlery" src="models_marriage_room/cutlery/viking_tea_party_-_cutlery.glb"></a-asset-item>
			<a-asset-item id="viking-horn" src="models_marriage_room/cutlery/viking_tea_party_-_drinking_horn.glb"></a-asset-item>
			<a-asset-item id="viking-stove" src="models_marriage_room/cutlery/viking_tea_party_-_viking_stove.glb"></a-asset-item>
			<a-asset-item id="pillar-model" src="models_marriage_room/viking_column.glb"></a-asset-item>
			<a-asset-item id="rune_sword" src="models_marriage_room/viking_rune_sword.glb"></a-asset-item>
			<a-asset-item id="key-model" src="models_marriage_room/key_in_bronze_viking_age.glb"></a-asset-item>
			<a-asset-item id="statue_viking_goddess" src="models_marriage_room/viking_goddess.glb"></a-asset-item>
			<a-asset-item id="pillar_showcase" src="models_marriage_room/scandinavian_column.glb"></a-asset-item>
			<a-asset-item id="chest-model" src="models_marriage_room/furniture/viking_chest.glb"></a-asset-item>
			<a-asset-item id="npc-idle" src="models_marriage_room/animations_npc/idle.glb"></a-asset-item>
			<!-- Imagens -->
			<img id="link-image" src="pngtree-gray-network-placeholder-png-image_3416659.jpg">
		</a-assets>
		
		<!-- camera rig (player) -->
		<a-entity id="player" position="0 0 0" thumbstick-movement="speed: 0.9" vr-hands wasd-controls="acceleration: 20">
			<a-entity id="camera" camera position="0 3 0" look-controls="pointerLockEnabled: false"
				cursor="rayOrigin: mouse; fuse: false"
				raycaster="objects: .clickable, .grabbable">
			</a-entity>
		</a-entity>
		
		<!-- Ambiente 3D: modelo GLB -->
		<a-entity id="vr_gallery" gltf-model="#gallery-model" position="0 0 0" scale="1.5 1.5 1.5"></a-entity>
		
		<!-- Tortoise brooch em cima do pilar -->
		<a-entity geometry="primitive: box; width: 0.3; height: 0.3; depth: 0.3" material="color: orange"
			position="2 1.5 2" grabbable hover center-grab>
			<a-box spatial-modal="color: white" width="0.3" height="0.3" depth="0.3" position="0 0 0"></a-box>
		</a-entity>
		
		<!-- Vitrines -->
		<a-entity gltf-model="#showcase1-model" position="-9 0 4" scale="1 1 1" rotation="0 90 0"></a-entity>
		<a-entity gltf-model="#showcase1-model" position="3 0 4" scale="1.5 1.5 1.5" rotation="0 0 0"></a-entity>
		<a-entity gltf-model="#showcase2-model" position="-3 0 -5" scale="1.3 1.3 1.3" rotation="0 90 0"></a-entity>
		<a-entity gltf-model="#showcase2-model" position="3 0 -5" scale="1.3 1.3 1.3" rotation="0 -90 0"></a-entity>

		<!-- Roupas dentro das vitrines -->
		<a-entity gltf-model="#viking-outfit-model" position="-5.4 0.35 -5" scale="1.2 1.2 1.2" rotation="0 0 0"></a-entity>
		<a-entity gltf-model="#viking-man-outfit-model" position="5.4 0.35 -5" scale="1.3 1.3 1.3" rotation="0 0 0"></a-entity>
		<!-- modelo de cadeira no showcase1-->
		<a-entity gltf-model="#chair-model" position="-9 0 4" scale="1.6 1.6 1.6" rotation="0 180 0"></a-entity>
		<!-- modelo de mesa-->
		<a-entity gltf-model="#table" position="-1.4 0 4" scale="0.013 0.013 0.013" rotation="0 0 0"></a-entity>		
		<!-- Cutlery em cima da mesa -->
		<a-entity gltf-model="#viking-bowl" position="-2.8 1.65 4.1" scale="0.2 0.2 0.2" rotation="0 90 0"></a-entity>
		<a-entity gltf-model="#viking-cup" position="-4 1.45 4.6" scale="4 4 4" rotation="0 45 0"></a-entity>
		<a-entity gltf-model="#viking-mug" position="-3.4 1.5 4.6" scale="0.2 0.2 0.2" rotation="0 60 0"></a-entity>
		<a-entity gltf-model="#viking-cutlery" position="-2 1.35 4.1" scale="0.2 0.2 0.2" rotation="0 0 0"></a-entity>
		<a-entity gltf-model="#viking-horn" position="-1.6 1.6 4.6" scale="0.4 0.4 0.4" rotation="0 0 0"></a-entity>
		<!-- Bathtub -->
		<a-entity gltf-model="#bathtub-model" position="3 0.8 4" scale="0.7 0.7 0.7"></a-entity>
		<!-- NPC idle ao lado da bathtub -->
		<a-entity gltf-model="#npc-idle" position="8.5 0 4" rotation="0 180 0" scale="0.015 0.015 0.015" animation-mixer npc-dialogue="audioSrc: audio/npc-marriage-dialogue.mp3; portalDestination: marriageChallenge.html"></a-entity>
		<!-- Stove -->
		<a-entity gltf-model="#viking-stove" position="-6 0.6 4" scale="1 1 1" rotation="0 90 0"></a-entity>
		<!-- Viking pillar -->
		<a-entity gltf-model="#pillar-model" position="-1.3 1.6 -5" rotation="0 0 0"></a-entity>
		<!-- Sword on the expositor -->
		<a-entity gltf-model="#rune_sword" position="3 1.2 -5" rotation="0 90 90" scale="1 1 1"></a-entity>
		<!-- Statue of Viking goddess -->
		<a-entity gltf-model="#statue_viking_goddess" position="-3 1.6 -5" rotation="0 180 0" scale="1 1 1"></a-entity>
		<a-entity gltf-model="#pillar_showcase" position="-3 0.3 -5" rotation="0 -90 0" scale="0.1 0.05 0.1"></a-entity>
		<!-- Bau -->
		<a-entity gltf-model="#chest-model" position="-9 0 -5" rotation="0 90 0" scale="1 1 1"></a-entity>
		<!-- Link para voltar ao index.html -->
		<a-entity position="10 1.6 -3" rotation="0 -90 0">
			<a-link href="index.html" title="Voltar ao Início" image="#link-image" class="clickable"></a-link>
		</a-entity>
	</a-scene>
</body>
</html>
