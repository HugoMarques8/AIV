<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Viking Lif Experience - Final Scene</title>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@master/dist/aframe-master.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component/dist/aframe-event-set-component.min.js"></script>
    <script
        src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
    <script src="https://unpkg.com/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls/dist/aframe-blink-controls.min.js"></script>
    <script src="js/handedness-setup.js"></script>
    <style>
        body {
            margin: 0;
        }

        #white-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            transition: opacity 0.5s;
        }
    </style>
</head>

<body>
    <div id="white-flash"></div>
    <a-scene>
        <a-assets>
            <a-asset-item id="white-gallery" src="initial_room/white_round_exhibition_gallery.glb"></a-asset-item>
            <!-- Casa do finalChallenge na floresta -->
            <a-asset-item id="final-house" src="models_final_room/Challenge/scene.glb"></a-asset-item>
            <!-- Skybox 360° de Aurora Boreal -->
            <img id="aurora-sky" src="models_marriage_room/images/NightSkyHDRI007_4K_TONEMAPPED.jpg">
            <!-- Exemplos de NPCs, substitui pelos modelos que quiseres -->
            <a-asset-item id="adulthood" src="models_adulthood_room/viking_torvidar/scene.gltf"></a-asset-item>
            <a-asset-item id="marriage" src="models_marriage_room/animations_npc/idle.glb"></a-asset-item>
            <a-asset-item id="final" src="models_final_room/volva.glb"></a-asset-item>
            <a-asset-item id="portal-model" src="initial_room/wormhole_concept.glb"></a-asset-item>
            <!-- Audios dos NPCs -->
            <audio id="audio-adulthood" src="audio_ending/audio-adulthood.mp3" preload="auto"></audio>
            <audio id="audio-marriage" src="audio_ending/audio-marriage.mp3" preload="auto"></audio>
            <audio id="audio-final" src="audio_ending/audio-final.mp3" preload="auto"></audio>
            <!-- Áudio de despedida da simulação -->
            <audio id="simulation-goodbye" src="audio_ending/simulation_ending.mp3" preload="auto"></audio>
            <!-- Áudio de entrada na sala final -->
            <audio id="simulation-intro" src="audio_ending/intro-ending.mp3" preload="auto"></audio>
        </a-assets>

        <!-- Sala final (igual ao ultimo challenge) -->
        <a-entity gltf-model="#final-house" position="0 -1 2" scale="2 2 2"></a-entity>
        <!-- Céu de inverno nórdico com Aurora Boreal -->
        <a-sky src="#aurora-sky" radius="500"></a-sky>

        <!-- NPCs de cada sala -->

        <a-entity id="npc-adulthood" gltf-model="#adulthood" position="-2 1.25 -2" scale="1.3 1.3 1.3"
            class="clickable"></a-entity>
        <a-entity id="subtitle-adulthood" position="-2 3.1 -2" visible="false">
            <a-plane color="#000000" opacity="0.7" width="3.5" height="0.5"></a-plane>
            <a-text id="subtitle-text-adulthood" value="" position="0 0 0.01" align="center" color="#FFFFFF" width="3.2"
                wrap-count="32"></a-text>
        </a-entity>

        <a-entity id="npc-marriage" gltf-model="#marriage" position="2 0 -2" animation-mixer
            scale="0.012 0.012 0.012" class="clickable"></a-entity>
        <a-entity id="subtitle-marriage" position="2 2.4 -2" visible="false">
            <a-plane color="#000000" opacity="0.7" width="3.5" height="0.5"></a-plane>
            <a-text id="subtitle-text-marriage" value="" position="0 0 0.01" align="center" color="#FFFFFF" width="3.2"
                wrap-count="32"></a-text>
        </a-entity>

        <a-entity id="npc-final" gltf-model="#final" position="0 0 0" scale="1.7 1.7 1.7" class="clickable"></a-entity>
        <a-entity id="subtitle-final" position="0 2.2 0" visible="false">
            <a-plane color="#000000" opacity="0.7" width="3.5" height="0.5"></a-plane>
            <a-text id="subtitle-text-final" value="" position="0 0 0.01" align="center" color="#FFFFFF" width="3.2"
                wrap-count="32"></a-text>
        </a-entity>

        <!-- Portal de saída -->
        <a-entity id="final-portal" gltf-model="#portal-model" animation-mixer position="0 2 -6" scale="1.2 1.2 1.2">
            <a-cylinder id="portal-collider" position="0 1.5 0" radius="1" height="3"
                material="opacity:0; transparent:true" class="clickable"></a-cylinder>
        </a-entity>

        <!-- Luzes -->
        <a-entity light="type: point; color: #00d4ff; intensity: 2; distance: 6" position="0 1.4 -8"></a-entity>
        <a-entity light="type: point; color: #fff; intensity: 1; distance: 4" position="0 0 -8"></a-entity>
        <a-entity light="type: ambient; color: #FFF; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 0.5" position="5 10 5"></a-entity>

        <!-- Texto final de agradecimento -->
        <a-entity id="thank-you-text" position="0 1.5 -14" visible="false">
            <a-plane color="#FFFFFF" opacity="0.7" width="6" height="2" position="0 0 -1"></a-plane>
            <a-text value="Thank you for playing!" align="center" color="#000000" width="10" font-size="0.5" position="0 0 0"></a-text>
            <a-light type="ambient" color="#FFFFFF" intensity="1"></a-light>
        </a-entity>

        <!-- Camera rig (player) -->
         <a-entity id="player" position="0 1.16 4"
			movement-controls="constrainToNavMesh: false" wasd-controls="acceleration: 20" vr-hands kinematic-body>
            <a-entity id="camera" camera position="0 1 0" look-controls="pointerLockEnabled: false"
                cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .clickable, .grabbable">
            </a-entity>
            <a-entity id="right-hand"></a-entity>
            <a-entity id="left-hand"></a-entity>
        </a-entity>

        <script>
            let currentAudio = null; // Áudio atual tocando (NPC)
            let audioStarted = false;
            let inputLocked = true; // block interactions until intro audio is played or user confirms

            function showDesktopAudioButton() {
                const id = 'intro-desktop-play';
                if (document.getElementById(id)) return;
                const btn = document.createElement('button');
                btn.id = id;
                btn.innerText = 'Play intro audio to continue';
                Object.assign(btn.style, { position: 'fixed', left: '50%', top: '50%', transform: 'translate(-50%, -50%)', padding: '12px 18px', 'font-size': '18px', 'z-index': 10000, background: '#ff4081', color: '#fff', border: 'none', 'border-radius': '6px' });
                btn.addEventListener('click', async () => {
                    try {
                        if (window.AudioContext || window.webkitAudioContext) {
                            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                            if (audioContext.state === 'suspended') await audioContext.resume();
                        }
                    } catch (e) { console.warn('resume failed', e); }
                    const introAudio = document.querySelector('#simulation-intro');
                    try {
                        await introAudio.play();
                        audioStarted = true;
                        inputLocked = false;
                        hideDesktopAudioButton();
                    } catch (e) { console.error('Intro audio still blocked after desktop button', e); }
                });
                document.body.appendChild(btn);
            }

            function hideDesktopAudioButton() { const el = document.getElementById('intro-desktop-play'); if (el) el.parentNode.removeChild(el); }

            document.addEventListener('DOMContentLoaded', function () {
                // Aguardar carregamento completo da cena
                const scene = document.querySelector('a-scene');
                scene.addEventListener('loaded', function () {
                    // Lock input until intro audio starts/finishes (keeps .clickable so raycasters still hit in VR)
                    inputLocked = true;

                    // Tocar áudio de introdução ao entrar na sala, com fallback se o autoplay for bloqueado
                    const introAudio = document.querySelector('#simulation-intro');

                    async function tryStartIntro() {
                        try {
                            if (window.AudioContext || window.webkitAudioContext) {
                                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                                if (audioContext.state === 'suspended') await audioContext.resume();
                            }
                        } catch (e) { console.warn('Could not resume AudioContext', e); }

                        try {
                            await introAudio.play();
                            audioStarted = true;
                            inputLocked = false; // allow interactions
                            console.log('Intro audio played on load');
                        } catch (err) {
                            console.warn('Intro audio blocked on load:', err);
                            // show fallback button for desktop
                            showDesktopAudioButton();

                            // controller gesture fallback in VR
                            const onSelect = async function () {
                                try {
                                    if (window.AudioContext || window.webkitAudioContext) {
                                        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                                        if (audioContext.state === 'suspended') await audioContext.resume();
                                    }
                                } catch (e) { console.warn('Resume failed on select', e); }
                                try {
                                    await introAudio.play();
                                    audioStarted = true;
                                    inputLocked = false;
                                    hideDesktopAudioButton();
                                    console.log('Intro audio started via controller select');
                                } catch (e2) {
                                    console.warn('Still blocked after selectstart', e2);
                                }
                                scene.removeEventListener('selectstart', onSelect);
                            };
                            scene.addEventListener('selectstart', onSelect, { once: true });
                        }

                        // ensure we re-enable interactions when intro ends (if it starts later)
                        introAudio.addEventListener('ended', function onEnded() {
                            inputLocked = false;
                            introAudio.removeEventListener('ended', onEnded);
                        });
                    }

                    if (introAudio) tryStartIntro();
                });

                // Flash branco ao atravessar o portal
                const portalCollider = document.querySelector('#portal-collider');
                const whiteFlash = document.querySelector('#white-flash');
                const player = document.querySelector('#player');
                const goodbyeAudio = document.querySelector('#simulation-goodbye');
                if (portalCollider && player && goodbyeAudio) {
                    portalCollider.addEventListener('click', function () {
                        if (inputLocked) { console.log('Portal click ignored, input locked'); return; }
                        console.log('Clicou no portal, currentAudio:', currentAudio);
                        // Parar áudio atual se estiver tocando
                        if (currentAudio && !currentAudio.paused) {
                            console.log('Parando áudio atual');
                            currentAudio.pause();
                            currentAudio.currentTime = 0;
                        }
                        // Desabilitar cliques no portal
                        portalCollider.classList.remove('clickable');
                        // Desabilitar controles do player e escondê-lo
                        player.removeAttribute('thumbstick-movement');
                        player.removeAttribute('wasd-controls');
                        player.removeAttribute('movement-controls');
                        player.setAttribute('visible', 'false');

                        // Mover player para posição inicial próxima ao portal
                        player.setAttribute('position', '0 1.16 -4.3');

                        // Iniciar movimento lento em direção ao portal
                        let steps = 0;
                        const totalSteps = 200; // Ajustar para velocidade
                        let moveInterval = setInterval(() => {
                            if (steps < totalSteps) {
                                const currentPos = player.getAttribute('position');
                                currentPos.z -= 0.05; // Mover lentamente para frente
                                player.setAttribute('position', currentPos);
                                steps++;
                            } else {
                                clearInterval(moveInterval);
                            }
                        }, 50);

                        // Tocar áudio de despedida
                        goodbyeAudio.currentTime = 0;
                        goodbyeAudio.play();

                        // Quando áudio termina, flash de luz e mostrar texto
                        goodbyeAudio.addEventListener('ended', function onEnded() {
                            // Parar movimento
                            clearInterval(moveInterval);
                            // Flash de luz
                            whiteFlash.style.opacity = 1;
                            setTimeout(() => {
                                whiteFlash.style.opacity = 0;
                                // Esconder tudo exceto o texto
                                const scene = document.querySelector('a-scene');
                                const entities = scene.querySelectorAll('a-entity:not(#thank-you-text)');
                                entities.forEach(entity => {
                                    if (entity.id !== 'thank-you-text') {
                                        entity.setAttribute('visible', 'false');
                                    }
                                });
                                const thankYouText = document.querySelector('#thank-you-text');
                                if (thankYouText) {
                                    thankYouText.setAttribute('visible', 'true');
                                }
                            }, 1000); // Flash dura 1 segundo
                            goodbyeAudio.removeEventListener('ended', onEnded);
                        });
                    });
                }

                // Configuração dos NPCs, painéis e legendas
                const npcs = [
                    {
                        npcId: 'npc-adulthood',
                        panelId: 'subtitle-adulthood',
                        textId: 'subtitle-text-adulthood',
                        audioId: 'audio-adulthood',
                        subtitles: [
                            { time: 0, text: 'Congratulations on completing the rite of adulthood.' },
                            { time: 3, text: 'Your journey is just beginning.' },
                            { time: 6, text: '' }
                        ]
                    },
                    {
                        npcId: 'npc-marriage',
                        panelId: 'subtitle-marriage',
                        textId: 'subtitle-text-marriage',
                        audioId: 'audio-marriage',
                        subtitles: [
                            { time: 0, text: 'The union of two souls strengthens the tribe.' },
                            { time: 3, text: 'May your journey be filled with love and courage.' },
                            { time: 6, text: '' }
                        ]
                    },
                    {
                        npcId: 'npc-final',
                        panelId: 'subtitle-final',
                        textId: 'subtitle-text-final',
                        audioId: 'audio-final',
                        subtitles: [
                            { time: 0, text: 'Wisdom is the greatest treasure.' },
                            { time: 4, text: 'Even in death, it does not end.' },
                            { time: 8, text: '' }
                        ]
                    }
                ];

                
                npcs.forEach(npc => {
                    const npcEl = document.querySelector('#' + npc.npcId);
                    const panelEl = document.querySelector('#' + npc.panelId);
                    const textEl = document.querySelector('#' + npc.textId);
                    let audioEl = document.querySelector('#' + npc.audioId);
                    
                    if (npcEl && panelEl && textEl && audioEl) {
                        npcEl.addEventListener('click', function () {
                            console.log('Clique no NPC: ' + npc.npcId);
                            // Parar áudio anterior
                            if (currentAudio && !currentAudio.paused) {
                                currentAudio.pause();
                                currentAudio.currentTime = 0;
                            }
                            // Esconder todos os painéis
                            npcs.forEach(n => {
                                const p = document.querySelector('#' + n.panelId);
                                const t = document.querySelector('#' + n.textId);
                                if (p && t) {
                                    p.setAttribute('visible', 'false');
                                    t.setAttribute('value', '');
                                }
                            });
                            // Se as interações estiverem bloqueadas (intro não começou), ignorar clicks
                            if (inputLocked) { console.log('Input locked - ignoring NPC click'); return; }
                            // Mostrar painel deste NPC quando áudio começa
                            audioEl.addEventListener('play', function onPlay() {
                                console.log('Áudio começou: ' + npc.audioId);
                                panelEl.setAttribute('visible', 'true');
                                audioEl.removeEventListener('play', onPlay);
                            });
                            let currentSubtitle = 0;
                            audioEl.currentTime = 0;
                            currentAudio = audioEl; // Definir áudio atual
                            audioEl.play();
                            // Atualizar legendas durante o áudio
                            audioEl.addEventListener('timeupdate', function onTimeUpdate() {
                                const currentTime = audioEl.currentTime;
                                if (currentSubtitle < npc.subtitles.length && currentTime >= npc.subtitles[currentSubtitle].time) {
                                    textEl.setAttribute('value', npc.subtitles[currentSubtitle].text);
                                    currentSubtitle++;
                                }
                                if (audioEl.ended) {
                                    audioEl.removeEventListener('timeupdate', onTimeUpdate);
                                }
                            });
                            // Esconder painel quando áudio termina
                            audioEl.addEventListener('ended', function onEnded() {
                                console.log('Áudio terminou: ' + npc.audioId);
                                setTimeout(() => {
                                    panelEl.setAttribute('visible', 'false');
                                    textEl.setAttribute('value', '');
                                }, 2000);
                                audioEl.removeEventListener('ended', onEnded);
                            });
                        });
                    }
                });
            });
        </script>
    </a-scene>
</body>

</html>
