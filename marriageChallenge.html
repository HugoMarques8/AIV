<!doctype html>
<html>

<head>
	<meta charset="utf-8">
	<title>Viking Marriage Ritual</title>
	<script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@master/dist/aframe-master.js"></script>
	<script src="https://unpkg.com/aframe-event-set-component/dist/aframe-event-set-component.min.js"></script>
	<script src="https://unpkg.com/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
	<script src="js/handedness-setup.js"></script>
	<script src="js/thumbstick-movement.js"></script>
	<script src="js/grip-grab-combat.js"></script>
	<script src="js/exchange-zone.js"></script>
</head>

<body>
	<a-scene>
		<!-- Assets -->
		<a-assets>
			<a-asset-item id="forest-scene" src="models_marriage_room/challenge scene/winter_forest.glb"></a-asset-item>
			<a-asset-item id="campfire" src="models_marriage_room/challenge scene/campfire.glb"></a-asset-item>
			<a-asset-item id="viking-sword" src="models_marriage_room/viking_rune_sword.glb"></a-asset-item>
			<a-asset-item id="viking-ring"
				src="models_marriage_room/challenge scene/ring_of_the_north.glb"></a-asset-item>
			<a-asset-item id="female-viking-idle" src="models_marriage_room/animations_npc/idle.glb"></a-asset-item>
			<a-asset-item id="npc-thankful" src="models_marriage_room/animations_npc/thankfull.glb"></a-asset-item>
			<!-- Skybox 360° de Aurora Boreal -->
			<img id="aurora-sky" src="models_marriage_room/images/NightSkyHDRI007_4K_TONEMAPPED.jpg">
			<img id="preview-museum" src="models_marriage_room/images/final_preview.png">
			<!-- Audio explicativo -->
			<audio id="ceremony-explanation" src="audio/ceremony-explanation.mp3" preload="auto"></audio>
			<audio id="ambient-sound" src="audio/ambient-sounds-at-night-243045.mp3" preload="auto"></audio>
			<audio id="fire-sound" src="audio/copyright-free-fire-crackling-427409.mp3" preload="auto"></audio>
		</a-assets>

		<!-- Camera rig (player) -->
		<a-entity id="player" position="0 0.8 0" thumbstick-movement="speed: 2.5"
			movement-controls="fly: false; speed: 0.25" wasd-controls vr-hands>
			<a-entity id="camera" camera position="0 3 0" look-controls cursor="rayOrigin: mouse; fuse: false"
				raycaster="objects: .clickable, .grabbable">
			</a-entity>
			<a-entity id="right-hand"></a-entity>
			<a-entity id="left-hand"></a-entity>
		</a-entity>

		<!-- Ambiente floresta -->
		<a-entity gltf-model="#forest-scene" position="0 0 0" scale="2 2 2"></a-entity>
		<a-entity gltf-model="#campfire" position="0 0 -12" scale="1 1 1" animation-mixer
			sound="src: #fire-sound; autoplay: true; loop: true; volume: 0.7"></a-entity>

		<!-- Céu de inverno nórdico com Aurora Boreal -->
		<a-sky src="#aurora-sky"></a-sky>

		<!-- Luz ambiente fria (inverno) -->
		<a-entity light="type: ambient; color: #b3c9d9; intensity: 0.6"></a-entity>
		<a-entity light="type: directional; color: #dde5ed; intensity: 0.8" position="5 10 5"></a-entity>


		<!-- NPC Viking no ritual -->
		<a-entity id="npc-astrid" gltf-model="#female-viking-idle" position="2 0 -6.5" scale="0.015 0.015 0.015"
			rotation="0 -30 0" animation-mixer class="clickable"></a-entity>

		<!-- Painel de subtítulos -->
		<a-entity id="npc-subtitle" position="2 4 -6.5" rotation="0 -30 0" visible="false">
			<a-plane color="#000000" opacity="0.7" width="6" height="0.5"></a-plane>
			<a-text id="subtitle-text" value="" position="0 0 0.01" align="center" color="#FFFFFF" width="5.5"
				wrap-count="50">
			</a-text>
		</a-entity>

		<!-- Espada do jogador -->
		<a-entity id="player-sword" gltf-model="#viking-sword" position="-3 2.5 -2" scale="1 1 1" rotation="0 120 90"
			class="grabbable"
			animation__float="property: position; to: -3 1.3 -2; dir: alternate; dur: 1500; loop: true; easing: easeInOutSine">
		</a-entity> <!-- Anel -->
		<a-entity id="ritual-ring" gltf-model="#viking-ring" position="3 2.5 0" scale="0.01 0.01 0.01" rotation="0 0 0"
			class="grabbable"
			animation__float="property: position; to: 3 1.3 0; dir: alternate; dur: 1500; loop: true; easing: easeInOutSine">
		</a-entity>

		<!-- Zona de troca -->
		<a-ring position="2 0.25 -6" rotation="-90 0 0" radius-inner="1" radius-outer="1.5" color="#FFD700"
			opacity="0.5" material="side: double">
			<a-animation attribute="rotation" from="-90 0 0" to="-90 360 0" dur="4000" repeat="indefinite"
				easing="linear">
			</a-animation>
			<a-text value="Exchange Zone" position="0 -0.5 0" align="center" color="#FFD700" width="4">
			</a-text>
		</a-ring>

		<!-- Cilindro invisível de detecção -->
		<a-cylinder id="exchange-zone" position="2 0.5 -6" radius="1.5" height="20" opacity="0"
			material="transparent: true; opacity: 0" exchange-zone>
		</a-cylinder> <!-- Portal de avançar para o final stage (aparece após ritual) -->
		<a-entity id="return-portal" position="-4 3.2 -10" rotation="0 30 0" visible="false">
			<a-text value="Challenge Complete!\nAdvance to the next room." position="0 0 0.2" align="center"
				color="#FFFFFF" width="3">
			</a-text>
			<a-link href="finalRite.html" title="Go for one Final Rite!" position="0 0 0" scale="2 3 1"
				class="clickable" image="#preview-museum">
			</a-link>
		</a-entity>

		<!-- Som ambiente geral -->
		<a-entity sound="src: #ambient-sound; autoplay: true; loop: true; volume: 0.5"></a-entity>

		<script>
			// Sistema simples de ritual
			let itemsExchanged = [];

			// Verificar quando objetos são soltos na zona
			document.addEventListener('DOMContentLoaded', function () {
				const sword = document.querySelector('#player-sword');
				const ring = document.querySelector('#ritual-ring');
				const zone = document.querySelector('a-ring');
				const returnPortal = document.querySelector('#return-portal');
				const subtitleText = document.querySelector('#subtitle-text');
				const subtitlePanel = document.querySelector('#npc-subtitle');

				// Mostrar subtítulos com o áudio
				const subtitles = [
					{ time: 0, text: "Come forth. You witness the sacred Viking marriage ceremony." },
					{ time: 4, text: "The groom presents his ancestral sword to the bride - a blade from his forefathers." },
					{ time: 10, text: "She holds it in trust for her sons, continuing the bloodline." },
					{ time: 15, text: "In return, she offers her family's sword to him, transferring her father's protection." },
					{ time: 19, text: "Finally, they exchange finger rings upon the sword hilts, sealing their sacred oath." },
					{ time: 24, text: "Complete this ancient ritual. Bring your sword and ring to me." },
					{ time: 34, text: "" } // limpar texto no final
				];

				const audio = document.querySelector('#ceremony-explanation');
				const npc = document.querySelector('#npc-astrid');
				let currentSubtitle = 0;
				let audioPlayed = false;

				// Tocar áudio automaticamente quando a cena carregar
				setTimeout(() => {
					audio.play().then(() => {
						audioPlayed = true;
					}).catch(error => console.log('Autoplay prevented:', error));
				}, 1000);

				// Tocar áudio ao clicar na NPC (se ainda não tocou)
				npc.addEventListener('click', function () {
					if (!audioPlayed) {
						audio.currentTime = 0;
						currentSubtitle = 0;
						audio.play();
						audioPlayed = true;
					}
				});

				audio.addEventListener('play', function () {
					subtitlePanel.setAttribute('visible', 'true');
				});

				audio.addEventListener('timeupdate', function () {
					const currentTime = audio.currentTime;
					if (currentSubtitle < subtitles.length && currentTime >= subtitles[currentSubtitle].time) {
						subtitleText.setAttribute('value', subtitles[currentSubtitle].text);
						currentSubtitle++;
					}
				});

				audio.addEventListener('ended', function () {
					setTimeout(() => {
						subtitlePanel.setAttribute('visible', 'false');
					}, 2000);
				});

				// Parar animação quando pegar na espada
				sword.addEventListener('grab-start', function () {
					sword.removeAttribute('animation__float');
				});

				// Parar animação quando pegar no anel
				ring.addEventListener('grab-start', function () {
					ring.removeAttribute('animation__float');
				});
				// Detectar quando objetos são soltos na zona de troca é feito
				//  pelo componente exchange-zone
			});
		</script>
	</a-scene>
</body>

</html>
