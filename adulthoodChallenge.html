<!doctype html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@master/dist/aframe-master.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component/dist/aframe-event-set-component.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
    <script src="https://unpkg.com/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
    <script src="js/handedness-setup.js"></script>
    <script src="js/thumbstick-movement.js"></script>
    <script src="js/grip-grab.js"></script>
	  <script src="js/exchange-zone.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-img id = "ground" src = "models_adulthood_room/ground.jpg"></a-img>
        <a-asset-item
          id = "viking_house"
          src = "models_adulthood_room/viking_hut/scene.gltf">
        </a-asset-item>
        <a-asset-item
          id = "ax"
          src = "models_adulthood_room/the_ax_vikings/scene.gltf">
        </a-asset-item>
        <a-asset-item
          id = "hammer"
          src = "models_adulthood_room/viking_hammer/scene.gltf">
        </a-asset-item>
        <a-asset-item
          id = "sword"
          src = "models_adulthood_room/viking_sword_with_runes__game-ready_3d_model/scene.gltf">
        </a-asset-item>
        <a-asset-item
          id = "bob"
          src = "models_adulthood_room/bob/scene.gltf">
        </a-asset-item>
        <a-asset-item
          id = "north_sky"
          src = "models_adulthood_room/free_-_skybox_tundra_northern_lights/scene.gltf">
        </a-asset-item>
      </a-assets>

      <a-plane 
        src="#ground"
        position="0 1.476 0" 
        rotation="-90 0 0" 
        width="626" 
        height="399"
        repeat="100 100"
      ></a-plane>

      <a-entity
        id="sky"
        gltf-model="#north_sky"
        scale="1 1 1"
        position="0 25 0"
        rotation="0 -90 0">
      </a-entity>

      <a-entity
        id="bob_entity"
        gltf-model="#bob"
        scale="0.015 0.015 0.015"
        position="0 1.6 -5"
        rotation="0 90 0">
      </a-entity>
      <a-entity
        id="weapon_ax"
        gltf-model="#ax"
        scale="0.4 0.4 0.4"
        position="-1 2 -1.3"
        rotation="0 90 90"
			  class="grabbable" 
        animation="property: rotation; to: 0 450 90; loop: true; dur: 8000; easing: linear">
      </a-entity>
      <a-entity
        id="weapon_hammer"
        gltf-model="#hammer"
        scale="1 1 1"
        position="0 2.1 -1.3"
        rotation="-72 -122 173"
			  class="grabbable"
        animation="property: rotation; to: -72 238 173; loop: true; dur: 8000; easing: linear">
      </a-entity>
      <a-entity
        id="weapon_sword"
        gltf-model="#sword"
        scale="0.2 0.2 0.2"
        position="1 2 -1.3"
        rotation="3 -20 -35"
			  class="grabbable"
        animation="property: rotation; to: 3 340 -35; loop: true; dur: 8000; easing: linear">
      </a-entity>
      <a-entity
        id="house_entity"
        gltf-model="#viking_house"
        scale="1 1 1"
        position="0 1.5 3"
        rotation="0 -90 0">
      </a-entity>

      <a-entity id="player" position="0 1 0" thumbstick-movement="speed: 3.0" movement-controls="fly: false; speed: 0.25" wasd-controls vr-hands>
        <a-entity id="camera" camera position="0 1 0" look-controls 
          cursor="rayOrigin: mouse; fuse: false"
          raycaster="objects: .clickable, .grabbable">
        </a-entity>
        <a-entity id="right-hand"></a-entity>
        <a-entity id="left-hand"></a-entity>
		  </a-entity>
      
      <a-entity position="0 3.5 -7">
        <a-link href="index.html" title="Voltar ao Início"
          image="pngtree-gray-network-placeholder-png-image_3416659.jpg" class="clickable">
        </a-link>
      </a-entity>
    </a-scene>
  </body>
</html>
