<!doctype html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@master/dist/aframe-master.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component/dist/aframe-event-set-component.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
    <script src="https://unpkg.com/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
    <script src="js/handedness-setup.js"></script>
    <script src="js/thumbstick-movement.js"></script>
    <script src="js/grip-grab-combat.js"></script>
	  <script src="js/exchange-zone.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-img id = "ground" src = "models_adulthood_room/ground.jpg"></a-img>
        <a-img id = "link-image" src = "images_adulthood/marriage.png" >
        <a-asset-item id = "viking_house" src = "models_adulthood_room/viking_hut/scene.gltf"></a-asset-item>
        <a-asset-item id = "ax" src = "models_adulthood_room/the_ax_vikings/scene.gltf"></a-asset-item>
        <a-asset-item  id = "hammer" src = "models_adulthood_room/viking_hammer/scene.gltf"></a-asset-item>
        <a-asset-item id = "sword" src = "models_adulthood_room/viking_sword_with_runes__game-ready_3d_model/scene.gltf"></a-asset-item>
        <a-asset-item id = "bob" src = "models_adulthood_room/bob/scene.gltf"> </a-asset-item>
        <a-asset-item id = "north_sky"  src = "models_adulthood_room/free_-_skybox_tundra_northern_lights/scene.gltf"></a-asset-item>
        <a-asset-item id= "forest-scene" src="models_marriage_room/challenge scene/winter_forest.glb"></a-asset-item>

        <audio id="scene-noise" src = "audio_adulthood/ambient.m4r" preload="auto"></audio>
      </a-assets>

      <a-plane 
        src="#ground"
        position="0 1.476 0" 
        rotation="-90 0 0" 
        width="626" 
        height="399"
        repeat="100 100">
      </a-plane>

      <a-entity 
        gltf-model="#forest-scene" 
        position="0 1.29 8.537" 
        rotation="0 -11.170 0"
        scale="2 2 2"
        sound = "src: #scene-noise; autoplay: true; loop: true; volume: 0.5">
      </a-entity>

      <a-entity
        id="sky"
        gltf-model="#north_sky"
        scale="1 1 1"
        position="0 25 0"
        rotation="0 -90 0">
      </a-entity>

      <a-entity
        id="bob_entity"
        gltf-model="#bob"
        scale="0.009 0.009 0.009"
        position="0 1.6 -5"
        rotation="0 90 0">
        <a-cylinder id="bob-Colision" position="-0.66 94.20334 -0.011" height="1" radius="1" static-body="shape: cylinder" visible = "false" geometry="height: 100; radius: 20"></a-cylinder>
      </a-entity>
      <a-entity id="health-Bar" position = "0 3.25 -5">
        <a-plane id="health-exterior" color="#000000" opacity="0.9" width="2.5" height="0.25"></a-plane>
        <a-plane id="health-ammountRed" position="0 0 0.01" color="#ff0000" opacity="0.9" width="2.4" height="0.15"></a-plane>
        <a-plane id="health-ammountGreen" position="0 0 0.02" color="#00ff00" opacity="0.9" width="2.4" height="0.15"></a-plane>
      </a-entity>
      <a-entity
        id="weapon_ax"
        gltf-model="#ax"
        scale="0.4 0.4 0.4"
        position="-1 2 -3.5"
        rotation="0 90 90"
			  class="grabbable" 
        animation__float="property: rotation; to: 0 450 90; loop: true; dur: 8000; easing: linear">
        <a-box id = "ax-Colision" position="-0.66 -0.112 -0.011" width="0.39" height="0.6" depth="0.001" rotation="-0.552 0.358 -89.803" visible="false" static-body="shape: box"></a-box>
      </a-entity>
      <a-entity
        id="weapon_hammer"
        gltf-model="#hammer"
        scale="1 1 1"
        position="0 2.1 -3.5"
        rotation="-72 -122 173"
			  class="grabbable"
        animation__float="property: rotation; to: -72 238 173; loop: true; dur: 8000; easing: linear">
        <a-box id = "hammer-Colision"position="-0.01 0.149 -0.443" width="0.17" height="0.37" depth="0.17" rotation="17.656 0.218 -147.6" visible="false" static-body="shape: box"></a-box>
      </a-entity>
      <a-entity
        id="weapon_sword"
        gltf-model="#sword"
        scale="0.2 0.2 0.2"
        position="1 2 -3.5"
        rotation="3 -20 -35"
			  class="grabbable"
        animation__float="property: rotation; to: 3 340 -35; loop: true; dur: 8000; easing: linear">
        <a-box id = "sword-Colision" position="0.065 0.034 0.124" width="0.55" height="3" depth="0.03" rotation="-11.817 8.805 34.239" visible="false" static-body="shape: box"></a-box>
      </a-entity>
      <a-entity
        id="house_entity"
        gltf-model="#viking_house"
        scale="1 1 1"
        position="0 1.5 3"
        rotation="0 -90 0">
      </a-entity>
      <a-box position="0 4.2 3" width="8" height="6" depth="6" visible="false" static-body="shape: box"></a-box>

      <a-entity id="player" position="0 1.476 -1" thumbstick-movement="speed: 3.0" movement-controls="fly: false; speed: 0.25" wasd-controls vr-hands>
        <a-entity id="camera" camera position="0 1 0" look-controls 
          cursor="rayOrigin: mouse; fuse: false"
          raycaster="objects: .clickable, .grabbable">
        </a-entity>
        <a-entity id="right-hand"></a-entity>
        <a-entity id="left-hand"></a-entity>
		  </a-entity>
      
      <a-entity position="0 3.5 -7">
        <a-link href="marriageRite.html" title="Advance to Marriage Rite"
          image="#link-image" class="clickable">
        </a-link>
      </a-entity>

      <script>
				const sword = document.querySelector('#weapon_sword');
        const swordBox = document.querySelector('#sword-Colision');
        const hammer = document.querySelector('#weapon_hammer');
        const hammerBox = document.querySelector('#hammer-Colision');
        const ax = document.querySelector('#weapon_ax');
        const axBox = document.querySelector('#ax-Colision');

        const healthAmount = document.querySelector('#health-ammountGreen');
        const healthBar = document.querySelector('#health-Bar');

        const bob = document.querySelector('#bob-Colision');
        const bobEntity = document.querySelector('#bob_entity');

        // HP System
        let bobMaxHealth = 100;
        let bobCurrentHealth = 100;
        let lastHitTime = 0;
        const hitCooldown = 300; // milliseconds between hits

        // Update health bar width
        function updateHealthBar() {
          const healthPercent = Math.max(0, bobCurrentHealth / bobMaxHealth);
          const maxWidth = 2.4;
          const newWidth = maxWidth * healthPercent;
          healthAmount.setAttribute('width', newWidth);
          
          // Update position to keep bar left-aligned
          healthAmount.setAttribute('position', `${-(maxWidth - newWidth) / 2} 0 0.02`);
        }

        // Damage Bob
        function damageBob(damage) {
          const now = Date.now();
          if (now - lastHitTime < hitCooldown) return; // Prevent spam damage
          
          lastHitTime = now;
          bobCurrentHealth -= damage;
          
          if (bobCurrentHealth < 0) {
            bobCurrentHealth = 0;
          }
          
          updateHealthBar();
          
          // Visual feedback: brief scale pulse
          const originalScale = bobEntity.getAttribute('scale');
          bobEntity.setAttribute('scale', {
            x: originalScale.x * 0.95,
            y: originalScale.y * 0.95,
            z: originalScale.z * 0.95
          });
          setTimeout(() => {
            bobEntity.setAttribute('scale', originalScale);
          }, 100);
        }

        // Collision detection for weapons hitting Bob
        function checkWeaponCollisions() {
          const weapons = [
            { element: sword, damage: 15 },
            { element: hammer, damage: 25 },
            { element: ax, damage: 20 }
          ];

          weapons.forEach(weapon => {
            if (weapon.element && bob) {
              // Get world positions
              const weaponPos = weapon.element.object3D.getWorldPosition(new THREE.Vector3());
              const bobPos = bob.getWorldPosition(new THREE.Vector3());
              
              // Calculate distance
              const distance = weaponPos.distanceTo(bobPos);
              
              // If weapon is close enough to Bob, apply damage
              if (distance < 2) {
                damageBob(weapon.damage);
              }
            }
          });
        }

        // Run collision check every frame
        const scene = document.querySelector('a-scene');
        scene.addEventListener('renderstart', function() {
          scene.addEventListener('tick', checkWeaponCollisions);
        });

        // Initialize health bar
        updateHealthBar();

        sword.addEventListener('grab-start', function() {
					sword.removeAttribute('animation__float');
				});
        sword.addEventListener('grab-end', function() {
          sword.setAttribute('animation__float', 'property: rotation; to: 3 340 -35; loop: true; dur: 8000; easing: linear');
        });

        hammer.addEventListener('grab-start', function() {
          hammer.removeAttribute('animation__float');
        });
        hammer.addEventListener('grab-end', function() {
          hammer.setAttribute('animation__float', 'property: rotation; to: -72 238 173; loop: true; dur: 8000; easing: linear');
        });

        ax.addEventListener('grab-start', function() {
          ax.removeAttribute('animation__float');
        });
        ax.addEventListener('grab-end', function() {
          ax.setAttribute('animation__float', 'property: rotation; to: 0 450 90; loop: true; dur: 8000; easing: linear');
        });
      </script>
    </a-scene>
  </body>
</html>
