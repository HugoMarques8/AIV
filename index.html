<!doctype html>
<html>
  <head>
  <meta charset="utf-8">
  <title>Viking Lif Experience</title>
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@master/dist/aframe-master.js"></script>
  <script src="https://unpkg.com/aframe-event-set-component/dist/aframe-event-set-component.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
  <script src="https://unpkg.com/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
  <script src="js/handedness-setup.js"></script>
	<script src="js/thumbstick-movement.js"></script>
	<script src="js/grip-grab.js"></script>
  <style>
    #handedness-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-family: Arial, sans-serif;
      color: white;
    }
    #handedness-overlay h2 {
      margin-bottom: 30px;
      font-size: 28px;
    }
    #handedness-overlay button {
      margin: 10px;
      padding: 20px 40px;
      font-size: 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      transition: background 0.3s;
    }
    #handedness-overlay button:hover {
      background: #45a049;
    }
    .hidden {
      display: none !important;
    }
  </style>
  </head>
  <body>
    <div id="handedness-overlay">
      <h2>Escolha a sua mão dominante / Choose your dominant hand</h2>
      <button onclick="setHandedness('right')">Destro / Right-handed</button>
      <button onclick="setHandedness('left')">Esquerdino / Left-handed</button>
    </div>
    <script>
      function setHandedness(hand) {
        localStorage.setItem('dominantHand', hand);
        document.getElementById('handedness-overlay').classList.add('hidden');
      }
      // Esconder overlay somente se já foi escolhido anteriormente
      if (localStorage.getItem('dominantHand')) {
        document.getElementById('handedness-overlay').classList.add('hidden');
      }
    </script>
      <a-scene>
        <!-- Assets -->
        <a-assets>
          <a-asset-item id="white-gallery" src="initial_room/white_round_exhibition_gallery.glb"></a-asset-item>
          <img id="portal-image" src="pngtree-gray-network-placeholder-png-image_3416659.jpg">
          <audio id="intro-audio" src="audio/intro-simulation.mp3" preload="auto"></audio>
        </a-assets>
        
        <!-- Sala branca (Animus) -->
        <a-entity id="white-gallery-room" gltf-model="#white-gallery" position="0 0 0" scale="2 2 2"></a-entity>
        
        <!-- Luz ambiente -->
        <a-entity light="type: ambient; color: #FFF; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 0.5" position="5 10 5"></a-entity>
        
        <!-- Painel de introdução -->
        <a-entity id="intro-panel" position="0 2.5 -3" visible="false">
          <a-plane id="intro-bg" color="#000000" opacity="0.85" width="5" height="4" class="clickable"></a-plane>
          <a-text id="loading-text" 
            value="VIKINGR LIF\nTEMPORAL INTEGRATION SIMULATION" 
            position="0 0 0.01" 
            align="center" 
            color="#00D4FF" 
            width="4.5" 
            wrap-count="45"
            font="monoid"
            visible="true">
          </a-text>
          <a-text id="intro-text" 
            value="\n\n\nWelcome, Time Explorer.\n\nYou are entering a simulation focused on Viking civilization.\nIntegrate yourself into the past to investigate\nand discover what made this ancient society thrive.\n\nExperience the sacred Norse rituals from within\ntheir culture.\n\nGo to the portal to iniciate your immersion." 
            position="0 0 0.02" 
            align="center" 
            color="#00D4FF" 
            width="4.5" 
            wrap-count="45"
            font="monoid"
            visible="false">
          </a-text>
          <a-text id="click-prompt" 
            value="[Click to continue]" 
            position="0 -1.5 0.02" 
            align="center" 
            color="#FFD700" 
            width="2" 
            visible="false"
            animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; dur: 1000; loop: true; easing: easeInOutSine">
          </a-text>
        </a-entity>
        
        <!-- camera rig (player) -->
		  <a-entity id="player" position="0 1.6 0" thumbstick-movement="speed: 0.9" vr-hands wasd-controls="acceleration: 20">
			  <a-entity id="camera" camera position="0 0 0" look-controls="pointerLockEnabled: false"
				  cursor="rayOrigin: mouse; fuse: false"
				  raycaster="objects: .clickable, .grabbable">
			  </a-entity>
        <a-entity id="right-hand"></a-entity>
        <a-entity id="left-hand"></a-entity>
		  </a-entity>

        <!-- Portal para adulthoodRite.html -->
        <a-entity id="adulthood-portal" position="0 1.6 -5" visible="false">
          <a-link href="adulthoodRite.html" title="Begin Experience (Adulthood)" color="#00D4FF" image="#portal-image" class="clickable"></a-link>
        </a-entity>

        <!-- Portal para marriageRite.html -->
        <a-entity id="marriage-portal" position="-3 1.6 -5" visible="false">
          <a-link href="marriageRite.html" title="Begin Experience (Marriage)" color="#00D4FF" image="#portal-image" class="clickable"></a-link>
        </a-entity>
        
        <script>
          document.addEventListener('DOMContentLoaded', function() {
            const introPanel = document.querySelector('#intro-panel');
            const loadingText = document.querySelector('#loading-text');
            const introText = document.querySelector('#intro-text');
            const clickPrompt = document.querySelector('#click-prompt');
            const introAudio = document.querySelector('#intro-audio');
            const adulthoodPortal = document.querySelector('#adulthood-portal');
            const marriagePortal = document.querySelector('#marriage-portal');
            const introBg = document.querySelector('#intro-bg');
            let audioStarted = false;
            
            // Sequência de introdução (sempre executar)
            setTimeout(() => {
              // Mostrar painel com loading
              introPanel.setAttribute('visible', 'true');
              introPanel.setAttribute('animation', {
                property: 'scale',
                from: '0.8 0.8 0.8',
                to: '1 1 1',
                dur: 1000,
                easing: 'easeOutQuad'
              });
              
              // Após 2 segundos, mostrar prompt para clicar
              setTimeout(() => {
                clickPrompt.setAttribute('visible', 'true');
              }, 2000);
            }, 500);
            
            // Clicar no background do painel para mostrar texto e iniciar áudio
            introBg.addEventListener('click', function(evt) {
              if (!audioStarted) {
                evt.stopPropagation();
                audioStarted = true;
                loadingText.setAttribute('visible', 'false');
                clickPrompt.setAttribute('visible', 'false');
                introText.setAttribute('visible', 'true');
                
                // Tocar áudio
                introAudio.play().catch(error => console.log('Audio play error:', error));
                
                // Quando o áudio terminar, esconder painel e mostrar portal
                introAudio.addEventListener('ended', function() {
                  setTimeout(() => {
                    introPanel.setAttribute('animation__fadeout', {
                      property: 'scale',
                      to: '0.8 0.8 0.8',
                      dur: 1000,
                      easing: 'easeInQuad'
                    });
                    
                    setTimeout(() => {
                      introPanel.setAttribute('visible', 'false');
                      // Remover a classe clickable do intro-bg para não bloquear o raycast
                      introBg.classList.remove('clickable');
                      adulthoodPortal.setAttribute('visible', 'true');
                      
                      // Animação de surgimento do portal
                      adulthoodPortal.setAttribute('animation', {
                        property: 'scale',
                        from: '0 0 0',
                        to: '1 1 1',
                        dur: 800,
                        easing: 'easeOutElastic'
                      });
                      marriagePortal.setAttribute('visible', 'true');
                      marriagePortal.setAttribute('animation', {
                        property: 'scale',
                        from: '0 0 0',
                        to: '1 1 1',
                        dur: 800,
                        easing: 'easeOutElastic'
                      });
                    }, 1000);
                  }, 1000);
                });
              }
            });
          });
        </script>
      </a-scene>
  </body>
</html>
