<!doctype html>
<html>
  <head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@master/dist/aframe-master.js"></script>
  <script src="https://unpkg.com/aframe-event-set-component/dist/aframe-event-set-component.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
  <script src="https://unpkg.com/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
  <script src="js/handedness-setup.js"></script>
  <style>
    #handedness-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-family: Arial, sans-serif;
      color: white;
    }
    #handedness-overlay h2 {
      margin-bottom: 30px;
      font-size: 28px;
    }
    #handedness-overlay button {
      margin: 10px;
      padding: 20px 40px;
      font-size: 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      transition: background 0.3s;
    }
    #handedness-overlay button:hover {
      background: #45a049;
    }
    .hidden {
      display: none !important;
    }
  </style>
  </head>
  <body>
    <div id="handedness-overlay">
      <h2>Escolha a sua mão dominante / Choose your dominant hand</h2>
      <button onclick="setHandedness('right')">Destro / Right-handed</button>
      <button onclick="setHandedness('left')">Esquerdino / Left-handed</button>
    </div>
    <script>
      function setHandedness(hand) {
        localStorage.setItem('dominantHand', hand);
        document.getElementById('handedness-overlay').classList.add('hidden');
      }
      // Esconder overlay somente se já foi escolhido anteriormente
      if (localStorage.getItem('dominantHand')) {
        document.getElementById('handedness-overlay').classList.add('hidden');
      }
    </script>
      <a-scene>
        <!-- Sala branca -->
        <a-box position="0 0 0" width="40" height="20" depth="40" color="#fff" material="side: double;" static-body></a-box>
        <!-- camera rig (player) -->
	      <a-entity id="player" position="0 0.7 0" movement-controls="fly: false; speed: 0.30" vr-hands>
          
        </a-entity>
			</a-entity>
	      </a-entity>
        <!-- Portal para marriageRite.html -->
        <a-entity position="0 1.6 -4">
          <a-link href="marriageRite.html" title="Ir para Marriage Rite" image="pngtree-gray-network-placeholder-png-image_3416659.jpg"></a-link>
        </a-entity>
        <!-- Portal para adulthoodRite.html -->
        <a-entity position="-5 1.6 -4">
          <a-link href="adulthoodRite.html" title="Ir para Adulthood Rite" image="pngtree-gray-network-placeholder-png-image_3416659.jpg"></a-link>
        </a-entity>
      </a-scene>
  </body>
</html>
