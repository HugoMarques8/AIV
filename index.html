<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Viking Lif Experience</title>
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@master/dist/aframe-master.js"></script>
  <script src="https://unpkg.com/aframe-event-set-component/dist/aframe-event-set-component.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
  <script src="https://unpkg.com/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
  <script src="js/handedness-setup.js"></script>
  <style>
    #handedness-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-family: Arial, sans-serif;
      color: white;
    }

    #handedness-overlay h2 {
      margin-bottom: 30px;
      font-size: 28px;
    }

    #handedness-overlay button {
      margin: 10px;
      padding: 20px 40px;
      font-size: 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      transition: background 0.3s;
    }

    #handedness-overlay button:hover {
      background: #45a049;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="handedness-overlay">
    <h2>Escolha a sua mão dominante / Choose your dominant hand</h2>
    <button onclick="setHandedness('right')">Destro / Right-handed</button>
    <button onclick="setHandedness('left')">Esquerdino / Left-handed</button>
  </div>
  <script>
    // Só iniciar boot depois da cena estar carregada
    let shouldStartBoot = false;
    let sceneReady = false;
    let prevPlayerPos = null;
    let storedFlashParent = null;
    let vrAudioButton = null;
    function startExperience() {
      shouldStartBoot = true;
    }

    function setHandedness(hand) {
      localStorage.setItem('dominantHand', hand);
      document.getElementById('handedness-overlay').classList.add('hidden');
      startExperience();
    }

    // Se já foi escolhida anteriormente, esconder overlay e marcar para iniciar experiência
    if (localStorage.getItem('dominantHand')) {
      document.getElementById('handedness-overlay').classList.add('hidden');
      startExperience();
    }

    // Esperar pelo carregamento da cena para marcar pronto
    document.addEventListener('DOMContentLoaded', function () {
      const scene = document.querySelector('a-scene');
      if (scene.hasLoaded) {
        sceneReady = true;
      } else {
        scene.addEventListener('loaded', function () {
          sceneReady = true;
        });
      }
    });

    function showWhiteFlash(callback) {
      const flash = document.getElementById('white-flash-boot');
      if (!flash) { if (callback) callback(); return; }
      flash.setAttribute('material', 'opacity', 0);
      flash.setAttribute('visible', 'true');
      // Fade in
      let opacity = 0;
      const fadeIn = setInterval(() => {
        opacity += 0.1;
        flash.setAttribute('material', 'opacity', opacity);
        if (opacity >= 1) {
          clearInterval(fadeIn);
          setTimeout(() => {
            // Fade out
            const fadeOut = setInterval(() => {
              opacity -= 0.1;
              flash.setAttribute('material', 'opacity', opacity);
              if (opacity <= 0) {
                clearInterval(fadeOut);
                flash.setAttribute('visible', 'false');
                if (callback) callback();
              }
            }, 30);
          }, 300); // tempo do flash branco
        }
      }, 30);
    }

    // VR audio button helper (most mobile/VR browsers block audio; show a VR button to explicitly start)
    function createVRAudioButton() {
      if (vrAudioButton) return vrAudioButton;
      const button = document.createElement('a-entity');
      button.setAttribute('id', 'vr-audio-button');
      button.setAttribute('geometry', 'primitive: plane; height: 0.4; width: 1');
      button.setAttribute('material', 'color: #ff4081; opacity: 0.95');
      button.setAttribute('position', '0 -0.6 -1');
      button.setAttribute('visible', 'false');
      button.setAttribute('class', 'clickable');

      const text = document.createElement('a-text');
      text.setAttribute('value', 'Play audio');
      text.setAttribute('align', 'center');
      text.setAttribute('color', '#fff');
      text.setAttribute('position', '0 0 0.01');
      text.setAttribute('width', '0.9');
      button.appendChild(text);

      button.addEventListener('click', async () => {
        console.log('VR audio button clicked');
        try {
          if (window.AudioContext || window.webkitAudioContext) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') await audioContext.resume();
          }
        } catch (e) {
          console.warn('Error resuming audio context', e);
        }
        const introAudioEl = document.getElementById('intro-audio');
        if (introAudioEl) {
          introAudioEl.play().then(() => {
            audioStarted = true;
            hideVRAudioButton();
            console.log('Intro audio started via VR button');
          }).catch(err => {
            console.error('Intro audio still failed', err);
          });
        }
      });

      vrAudioButton = button;
      return button;
    }

    function showVRAudioButton() {
      const camera = document.getElementById('camera');
      const button = createVRAudioButton();
      if (!button.parentNode) camera.appendChild(button);
      button.setAttribute('visible', 'true');
    }

    function hideVRAudioButton() {
      if (vrAudioButton) vrAudioButton.setAttribute('visible', 'false');
    }

    // Sequência de boot: mostra modelo spacedrive, toca áudios, esconde modelo, continua fluxo normal
    function playBootSequence(callback) {
      const spacedrive = document.getElementById('spacedrive-boot');
      const whiteGallery = document.getElementById('white-gallery-room');
      const introPanel = document.getElementById('intro-panel');
      const player = document.getElementById('player');
      // Esconder sala e painel de introdução durante o boot
      if (whiteGallery) whiteGallery.setAttribute('visible', 'false');
      if (introPanel) introPanel.setAttribute('visible', 'false');
      spacedrive.setAttribute('visible', 'true');
      //efeitos sonoros do portal
      const testAudio = document.getElementById('portal-idle-sound');
      testAudio.currentTime = 0;
      testAudio.volume = 0.2;
      testAudio.play();
      // Movimento lento do player para a frente
      let moveInterval = null;
      let moveTime = 0;
      const targetZ = 0;
      const totalSteps = 600; // ~5s a 60fps, ajusta conforme necessário
      let step = 0;
      function startMovingPlayer() {
        moveInterval = setInterval(() => {
          step++;
          let currentPos = player.getAttribute('position');
          if (currentPos.z > targetZ) {
            currentPos.z = Math.max(currentPos.z - (12 / totalSteps), targetZ);
            player.setAttribute('position', currentPos);
          }
          if (step >= totalSteps || currentPos.z <= targetZ) {
            clearInterval(moveInterval);
          }
        }, 16);
      }
      function stopMovingPlayer() {
        if (moveInterval) clearInterval(moveInterval);
      }
      startMovingPlayer();
      let idx = 0;
      function playNext() {
        const audio = document.getElementById('boot-audio-' + idx);
        if (audio) {
          audio.currentTime = 0;
          audio.play();
          audio.onended = () => {
            idx++;
            if (idx < 5) {
              playNext();
            } else {
              spacedrive.setAttribute('visible', 'false');
              stopMovingPlayer();
              // Mostrar sala e painel de introdução após boot
              showWhiteFlash(() => {
                if (testAudio) {
                  testAudio.pause();
                }
                if (whiteGallery) whiteGallery.setAttribute('visible', 'true');
                if (introPanel) introPanel.setAttribute('visible', 'true');
                if (callback) callback();
                const bootEndAudio = document.getElementById('boot-end-audio');
                const introBg = document.getElementById('intro-bg');
                if (bootEndAudio) {
                  bootEndAudio.currentTime = 0;
                  bootEndAudio.play().catch(() => { });
                  bootEndAudio.onended = () => {
                    if (introBg) introBg.classList.add('clickable');
                  };
                }
              });
            }
          };
        } else {
          idx++;
          if (idx < 5) {
            playNext();
          } else {
            spacedrive.setAttribute('visible', 'false');
            stopMovingPlayer();
            showWhiteFlash(() => {
              if (testAudio) {
                testAudio.pause();
              }
              if (whiteGallery) whiteGallery.setAttribute('visible', 'true');
              if (introPanel) introPanel.setAttribute('visible', 'true');
              const bootEndAudio = document.getElementById('boot-end-audio');
              const introBg = document.getElementById('intro-bg');
              if (bootEndAudio) {
                bootEndAudio.currentTime = 0;
                bootEndAudio.play().catch(() => { });
                bootEndAudio.onended = () => {
                  if (introBg) introBg.classList.add('clickable');
                };
              }
            });
          }
        }
      }
      playNext();
    }
  </script>
  <a-scene vr-mode-ui="enabled: true">
    <!-- Assets -->
    <a-assets>
      <a-asset-item id="white-gallery" src="initial_room/white_round_exhibition_gallery.glb"></a-asset-item>
      <img id="portal-image" src="images_adulthood/adultriteroom_preview.png">
      <audio id="intro-audio" src="audio/intro-simulation.mp3" preload="auto"></audio>
      <a-asset-item id="spacedrive-model" src="initial_room/wormhole_concept.glb"></a-asset-item>
      <audio id="boot-audio-0" src="audio/boot_0.mp3" preload="auto"></audio>
      <audio id="boot-audio-1" src="audio/boot_1.mp3" preload="auto"></audio>
      <audio id="boot-audio-2" src="audio/boot_2.mp3" preload="auto"></audio>
      <audio id="boot-audio-3" src="audio/boot_3.mp3" preload="auto"></audio>
      <audio id="boot-audio-4" src="audio/boot_4.mp3" preload="auto"></audio>
      <audio id="boot-end-audio" src="audio/boot_end.mp3" preload="auto"></audio>
      <audio id="portal-idle-sound" src="sound-effects/portal_idle-34022.mp3" preload="auto"></audio>
      <audio id="simulation-reminder" src="audio/simulation-reminder.mp3" preload="auto"></audio>
    </a-assets>
    <a-entity id="spacedrive-boot" gltf-model="#spacedrive-model" animation-mixer position="0 1.6 8" scale="1 1 2"
      visible="false">
    </a-entity>
    <a-entity light="type: point; color: #00d4ff; intensity: 2; distance: 6" position="0 1 0"></a-entity>
    <a-entity light="type: point; color: #fff; intensity: 1; distance: 4" position="0 0 0"></a-entity>
    <!-- Sala branca -->
    <a-entity id="white-gallery-room" gltf-model="#white-gallery" position="0 0 0" scale="2 2 2"></a-entity>

    <!-- Luz ambiente -->
    <a-entity light="type: ambient; color: #FFF; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.5" position="5 10 5"></a-entity>
    <!-- camera rig (player) -->
    <a-entity id="player" position="0 1.6 12" thumbstick-movement="speed: 0.9" vr-hands
      wasd-controls="acceleration: 20">
      <a-entity id="camera" camera position="0 0 0" look-controls="pointerLockEnabled: false"
        cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .clickable, .grabbable">
      </a-entity>
      <a-entity id="right-hand"></a-entity>
      <a-entity id="left-hand"></a-entity>
    </a-entity>

    <a-entity id="white-flash-boot" geometry="primitive: sphere; radius: 50"
      material="color: #fff; opacity: 0; transparent: true; side: back" position="0 1.6 0" visible="false">
    </a-entity>

    <!-- Painel de introdução -->
    <a-entity id="intro-panel" position="0 2.5 -3" visible="false">
      <a-plane id="intro-bg" color="#000000" opacity="0.85" width="5" height="4"></a-plane>
      <a-text id="loading-text" value="VIKINGR LIF\nTEMPORAL INTEGRATION SIMULATION" position="0 0 0.01" align="center"
        color="#00D4FF" width="4.5" wrap-count="45" font="monoid" visible="true">
      </a-text>
      <a-text id="intro-text"
        value="\n\n\nWelcome, Time Explorer.\n\nYou are entering a simulation focused on Viking civilization.\nIntegrate yourself into the past to investigate\nand discover what made this ancient society thrive.\n\nExperience the sacred Norse rituals from within\ntheir culture.\n\nGo to the portal to iniciate your immersion."
        position="0 0 0.02" align="center" color="#00D4FF" width="4.5" wrap-count="45" font="monoid" visible="false">
      </a-text>
      <a-text id="click-prompt" value="[Click to continue]" position="0 -1.5 0.02" align="center" color="#FFD700"
        width="2" visible="false"
        animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; dur: 1000; loop: true; easing: easeInOutSine">
      </a-text>
    </a-entity>


    <!--- Para a versão final apenas fica o adulthood na sala inicial! -->>
    <!-- Portal para adulthoodRite.html -->
    <a-entity id="adulthood-portal" position="0 1.6 -5" visible="false">
      <a-link title="Begin Experience (Adulthood)" color="#00D4FF" image="#portal-image"></a-link>
      <a-plane id="adulthood-portal-collider" width="1.5" height="2.5" position="0 0 0.05" material="opacity:0; transparent:true" class="clickable"></a-plane>
    </a-entity>
    <!--- Estes são apenas para motivos de debugging --->
    <!-- Portal para marriageRite.html -->
    <a-entity id="marriage-portal" position="-3 1.6 -5" visible="false">
      <a-link href="marriageRite.html" title="Begin Experience (Marriage)" color="#00D4FF"
        image="#portal-image"></a-link>
    </a-entity>

    <!-- Portal para finalRite.html -->
    <a-entity id="final-portal" position="3 1.6 -5" visible="false">
      <a-link href="finalRite.html" title="Begin Experience (Final)" color="#00D4FF" image="#portal-image"></a-link>
    </a-entity>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        // Check VR support
        if ('xr' in navigator) {
          navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
            if (!supported) {
              console.log('VR not supported');
              alert('VR não é suportado neste dispositivo/navegador. Certifique-se de que está a usar um navegador compatível com WebXR e que tem um dispositivo VR conectado.');
            }
          });
        } else {
          console.log('WebXR not available');
          alert('WebXR não está disponível. Atualize o seu navegador para uma versão que suporte WebXR.');
        }

        console.log('Para ver logs do Oculus Browser: ligue o Quest 2 ao PC, abra chrome://inspect no Chrome e inspecione a aba do "Oculus Browser".');
        const scene = document.querySelector('a-scene');
        scene.addEventListener('enter-vr', async () => {
          console.log('Entered VR');
          const player = document.getElementById('player');
          if (player) {
            const prevPos = player.getAttribute('position');
            prevPlayerPos = { x: prevPos.x, y: prevPos.y, z: prevPos.z };
            player.setAttribute('position', `${prevPos.x} 0 ${prevPos.z}`);
          }

          // Attach flash to camera so it reliably covers view in VR
          const camera = document.getElementById('camera');
          const flash = document.getElementById('white-flash-boot');
          if (flash && camera && flash.parentNode !== camera) {
            storedFlashParent = flash.parentNode;
            camera.appendChild(flash);
            flash.setAttribute('position', '0 0 0');
          }

          // If the audio is still blocked, allow controller press (selectstart) to act as a gesture and start audio
          async function handleSelectStart(evt) {
            console.log('VR selectstart received', evt);
            if (!audioStarted) {
              try {
                if (window.AudioContext || window.webkitAudioContext) {
                  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                  if (audioContext.state === 'suspended') await audioContext.resume();
                }
              } catch (e) {
                console.warn('Error resuming AudioContext on selectstart', e);
              }

              try {
                if (introAudioEl) {
                  await introAudioEl.play();
                  audioStarted = true;
                  hideVRAudioButton();
                  console.log('Intro audio started via controller select');
                }
              } catch (err) {
                console.warn('Intro audio still blocked after selectstart', err);
                showVRAudioButton();
              }

              if (audioStarted && sceneReady && shouldStartBoot) {
                playBootSequence();
              }
            }
            scene.removeEventListener('selectstart', handleSelectStart);
          }

          scene.addEventListener('selectstart', handleSelectStart, { once: true });

          // Start boot if ready (audio may already be started above)
          if (sceneReady && shouldStartBoot) {
            playBootSequence();
          }
        });

        scene.addEventListener('exit-vr', () => {
          console.log('Exited VR');
          const player = document.getElementById('player');
          if (prevPlayerPos && player) {
            player.setAttribute('position', `${prevPlayerPos.x} ${prevPlayerPos.y} ${prevPlayerPos.z}`);
            prevPlayerPos = null;
          }
          const flash = document.getElementById('white-flash-boot');
          if (flash && storedFlashParent && storedFlashParent !== flash.parentNode) {
            storedFlashParent.appendChild(flash);
            flash.setAttribute('position', '0 1.6 0');
            storedFlashParent = null;
          }
          hideVRAudioButton();
        });

        const introPanel = document.querySelector('#intro-panel');
        const loadingText = document.querySelector('#loading-text');
        const introText = document.querySelector('#intro-text');
        const clickPrompt = document.querySelector('#click-prompt');
        const introAudio = document.querySelector('#intro-audio');
        const adulthoodPortal = document.querySelector('#adulthood-portal');
        const marriagePortal = document.querySelector('#marriage-portal');
        const finalPortal = document.querySelector('#final-portal');
        const introBg = document.querySelector('#intro-bg');
        let audioStarted = false;

        // Sequência de introdução (sempre executar)
        setTimeout(() => {
          // Mostrar painel com loading
          introPanel.setAttribute('visible', 'true');
          introPanel.setAttribute('animation', {
            property: 'scale',
            from: '0.8 0.8 0.8',
            to: '1 1 1',
            dur: 1000,
            easing: 'easeOutQuad'
          });

          // Após 2 segundos, mostrar prompt para clicar
          setTimeout(() => {
            clickPrompt.setAttribute('visible', 'true');
          }, 2000);
        }, 500);

        // Clicar no background do painel para mostrar texto e iniciar áudio
        introBg.addEventListener('click', function (evt) {
          if (!audioStarted) {
            evt.stopPropagation();
            audioStarted = true;
            loadingText.setAttribute('visible', 'false');
            clickPrompt.setAttribute('visible', 'false');
            introText.setAttribute('visible', 'true');

            // Tocar áudio
            if (window.AudioContext || window.webkitAudioContext) {
              const audioContext = new (window.AudioContext || window.webkitAudioContext)();
              if (audioContext.state === 'suspended') {
                audioContext.resume().then(() => {
                  introAudio.play().catch(error => console.log('Audio play error:', error));
                });
              } else {
                introAudio.play().catch(error => console.log('Audio play error:', error));
              }
            } else {
              introAudio.play().catch(error => console.log('Audio play error:', error));
            }

            // Quando o áudio terminar, esconder painel e mostrar portal
            introAudio.addEventListener('ended', function () {
              setTimeout(() => {
                introPanel.setAttribute('animation__fadeout', {
                  property: 'scale',
                  to: '0.8 0.8 0.8',
                  dur: 1000,
                  easing: 'easeInQuad'
                });

                setTimeout(() => {
                  introPanel.setAttribute('visible', 'false');
                  // Remover a classe clickable do intro-bg para não bloquear o raycast
                  introBg.classList.remove('clickable');
                  adulthoodPortal.setAttribute('visible', 'true');

                  // Animação de surgimento do portal
                  adulthoodPortal.setAttribute('animation', {
                    property: 'scale',
                    from: '0 0 0',
                    to: '1 1 1',
                    dur: 800,
                    easing: 'easeOutElastic'
                  });
                  marriagePortal.setAttribute('visible', 'true');
                  marriagePortal.setAttribute('animation', {
                    property: 'scale',
                    from: '0 0 0',
                    to: '1 1 1',
                    dur: 800,
                    easing: 'easeOutElastic'
                  });
                  finalPortal.setAttribute('visible', 'true');
                  finalPortal.setAttribute('animation', {
                    property: 'scale',
                    from: '0 0 0',
                    to: '1 1 1',
                    dur: 800,
                    easing: 'easeOutElastic'
                  });

                  // Torna o portal principal clicável (mas não o link)
                  const adulthoodPortalEntity = document.getElementById('adulthood-portal');
                  const adulthoodPortalLink = adulthoodPortalEntity.querySelector('a-link');
                  const adulthoodPortalCollider = document.getElementById('adulthood-portal-collider');
                  const reminderAudio = document.getElementById('simulation-reminder');
                  let reminderPlayed = false;
                  if (adulthoodPortalCollider && adulthoodPortalLink && reminderAudio) {
                    adulthoodPortalCollider.addEventListener('click', function portalHandler(evt) {
                      if (!reminderPlayed) {
                        evt.preventDefault && evt.preventDefault();
                        evt.stopPropagation && evt.stopPropagation();
                        reminderAudio.currentTime = 0;
                        reminderAudio.play();
                        reminderPlayed = true;
                        // Após reminder, ativa o link e remove o plano
                        reminderAudio.onended = () => {
                          adulthoodPortalLink.setAttribute('href', 'adulthoodRite.html');
                          adulthoodPortalLink.classList.add('clickable');
                          adulthoodPortalCollider.parentNode.removeChild(adulthoodPortalCollider);
                          // tornar os links clicáveis (até os de teste):
                          document.querySelectorAll('a-link').forEach(link => link.classList.add('clickable'));
                        };
                      }
                    });
                  }
                }, 1000);
              }, 1000);
            });
          }
        });
      });
    </script>
  </a-scene>
</body>

</html>
