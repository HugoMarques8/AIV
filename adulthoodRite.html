<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@master/dist/aframe-master.js"></script>
	<script src="https://unpkg.com/aframe-event-set-component/dist/aframe-event-set-component.min.js"></script>
	<script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
	<script src="https://unpkg.com/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
  <script src="js/center-grab.js"></script>
	<script src="js/handedness-setup.js"></script>
	<script src="js/ritual-challenge.js"></script>
	<script src="js/thumbstick-movement.js"></script>
	<script src="js/grip-grab.js"></script>
</head>
<body>
	<a-scene>
		<a-assets>
			<!-- Modelos 3D -->
			<a-asset-item id="gallery-model" src="models_marriage_room/vr_gallery.glb"></a-asset-item>
			<a-asset-item id = "ax" src = "models_adulthood_room/the_ax_vikings/scene.gltf"></a-asset-item>
			<a-asset-item id = "hammer" src = "models_adulthood_room/viking_hammer/scene.gltf"></a-asset-item>
			<a-asset-item id = "sword" src = "models_adulthood_room/viking_sword_with_runes__game-ready_3d_model/scene.gltf"></a-asset-item>
			<a-asset-item id = "raven" src = "models_adulthood_room/raven_-_vikings_3d_prophecy_-_episode_16/scene.gltf"></a-asset-item>
			<a-asset-item id = "berserker_npc" src = "models_adulthood_room/viking_berserker_-_game_ready_rigged/scene.gltf"></a-asset-item>
			<a-asset-item id = "shield" src = "models_adulthood_room/viking_shield/scene.gltf"></a-asset-item>

			<!-- Imagens -->
			<img id="link-image" src="pngtree-gray-network-placeholder-png-image_3416659.jpg">
			<img id="audio-icon" src="models_marriage_room/images/audio-icon.png">
		</a-assets>

		<a-entity
			id="weapon_ax"
			gltf-model="#ax"
			scale="0.4 0.4 0.4"
			position="-1 2 -1.3">
		</a-entity>
		<a-entity
			id="weapon_hammer"
			gltf-model="#hammer"
			scale="1 1 1"
			position="0 2.1 -1.3">
		</a-entity>
		<a-entity
			id="weapon_sword"
			gltf-model="#sword"
			scale="0.2 0.2 0.2"
			position="1 2 -1.3">
		</a-entity>
		<a-entity
			id="entity_raven"
			gltf-model="#raven"
			scale="0.2 0.2 0.2"
			position="1 2 -1.3">
		</a-entity>
		<a-entity
			id="berserker_npc"
			gltf-model="#berserker_npc"
			scale="1.7 1.7 1.7"
			position="-3 0 -4">
		</a-entity>
		<a-entity
			id="entity_shield"
			gltf-model="#shield"
			scale="0.05 0.05 0.05"
			position="3 1 -2">
		</a-entity>
		
		<!-- camera rig (player) -->
		<a-entity id="player" position="0 0.95 0" thumbstick-movement="speed: 3.0" movement-controls wasd-controls="acceleration: 20" vr-hands>
			<a-entity id="camera" camera position="0 3 0" look-controls="pointerLockEnabled: false"
				cursor="rayOrigin: mouse; fuse: false"
				raycaster="objects: .clickable, .grabbable">
			</a-entity>
			<a-entity id="right-hand"></a-entity>
			<a-entity id="left-hand"></a-entity>
		</a-entity>
		
		<!-- Ambiente 3D: modelo GLB -->
		<a-entity id="vr_gallery" gltf-model="#gallery-model" position="0 0 0" scale="1.5 1.5 1.5"></a-entity>
		
		<!-- Link para voltar ao index.html -->
		<a-entity position="10 1.6 -3" rotation="0 -90 0">
			<a-link href="index.html" title="Voltar ao Início" image="#link-image" class="clickable"></a-link>
		</a-entity>
	</a-scene>
</body>
</html>
