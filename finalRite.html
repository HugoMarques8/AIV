      <!-- Link para ir para o desafio -->

          href="finalChallenge.html"

          class="clickable"

      <script>
        const npc = document.querySelector("#npc_entity");
        const audio = document.querySelector("#npc-audio");
        const subtitlePanel = document.querySelector("#npc-subtitle");
        const subtitleText = document.querySelector("#subtitle-text");
        const portal = document.querySelector("#challenge-portal");

        const subtitles = [
          { time: 0, text: "Welcome, traveler. I am the völva, guardian of ancient rites.",},
          { time: 5, text: "The body has been washed and dressed, as tradition commands.",},
          { time: 10, text: "Weapons, tools, and offerings lie ready to follow the dead into the next world.",},
          { time: 17, text: "Through these rites, we honor their life and guide their spirit onward.",},
          { time: 23, text: "The ancestors watch, and the gods bear witness." },
          { time: 28, text: "Are you ready to begin the final rite?" },
          { time: 32, text: "" }, // Clear subtitle
        ];

        let currentSubtitle = 0;
        let audioPlayed = false;

        // Clicar no NPC para iniciar diálogo
        npc.addEventListener("click", function () {
          if (!audioPlayed) {
            audio.currentTime = 0;
            currentSubtitle = 0;
            audio.play();
            audioPlayed = true;
          }
        });

        // Mostrar painel quando áudio começa
        audio.addEventListener("play", function () {
          subtitlePanel.setAttribute("visible", "true");
        });

        // Atualizar legendas durante o áudio
        audio.addEventListener("timeupdate", function () {
          const currentTime = audio.currentTime;
          if (
            currentSubtitle < subtitles.length &&
            currentTime >= subtitles[currentSubtitle].time
          ) {
            subtitleText.setAttribute("value", subtitles[currentSubtitle].text);
            currentSubtitle++;
          }
        });

        // Esconder legendas e mostrar portal quando terminar
        audio.addEventListener("ended", function () {
          setTimeout(() => {
            subtitlePanel.setAttribute("visible", "false");
            portal.setAttribute("visible", "true");
          }, 2000);
        });

        const infoTriggers = document.querySelectorAll(".info-trigger");
        let currentInfoAudio = null;

        infoTriggers.forEach((trigger) => {
          trigger.addEventListener("click", function () {
            const infoType = this.getAttribute("data-info");
            if (currentInfoAudio) {
              currentInfoAudio.pause();
            }

            currentInfoAudio = new Audio(`audio_final/${infoType}.mp3`);
            currentInfoAudio.play();
          });
        });
      </script>
